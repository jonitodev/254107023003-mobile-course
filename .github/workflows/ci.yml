name: Flutter CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-week-1-mobile-development-ecosystem-flutter-refresh
          - 02-week-2-declarative-ui-responsive-design
          - 03-week-3-navigation-state-management
          - 04-week-4-networking-rest-api
          - 05-week-5-local-storage-offline-first
          - 06-week-6-authentication-security-fcm
          - 07-week-7-clean-architecture
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Flutter SDK used by the committed lockfiles
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Restore exact dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze source
        run: flutter analyze --fatal-infos
      - name: Run tests
        run: flutter test --reporter expanded
